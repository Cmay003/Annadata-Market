# Annadata — Spring Boot Application Properties
# IMPORTANT: Do NOT put real secrets here.
# All sensitive values MUST be set as environment variables.
# See .env.example for the full list of required environment variables.

# Server
server.port=${PORT:5454}
spring.application.name=annadata-backend

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:annadata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.show-sql=true

# JWT
# Generate a strong random secret: openssl rand -hex 64
jwt.secret=${JWT_SECRET:}
jwt.expiry.ms=${JWT_EXPIRY_MS:86400000}

# Email / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Payment Gateways
stripe.api.key=${STRIPE_SECRET_KEY:}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# AI / Gemini
gemini.api.key=${GEMINI_API_KEY:}

# CORS / Frontend
# Set to your deployed frontend URL in production (e.g. https://annadata.vercel.app)
frontend.url=${FRONTEND_URL:http://localhost:5173}